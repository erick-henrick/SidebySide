<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chromium de teste · Side by Side</title>
<style>body{background:#17141d;color:#f3eefc;font:16px system-ui;margin:16px}#viewer{height:calc(100dvh - 72px)}</style>
</head><body>
<p id="status" role="status">Conectando ao Chromium da faculdade…</p>
<div id="viewer"></div>
<script type="module">
import RFB from './core/rfb.js';
const status = document.getElementById('status');
const address = new URL('./websockify', location.href);
address.protocol = 'wss:';
const desktop = new RFB(document.getElementById('viewer'), address.toString());
desktop.scaleViewport = true;
desktop.addEventListener('connect', () => {
  status.textContent = 'Chromium de teste. Entre com a conta Google de teste.';
  desktop.focus();
});
desktop.addEventListener('disconnect', () => {
  status.textContent = 'A sessão privada foi encerrada.';
});
</script>
</body></html>
